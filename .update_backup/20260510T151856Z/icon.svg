<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16052d"/>
      <stop offset="50%" stop-color="#1a0a3d"/>
      <stop offset="100%" stop-color="#0d1833"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="90" fill="url(#bgGrad)"/>

  <!-- Ambient glow -->
  <rect width="512" height="512" rx="90" fill="url(#glowGrad)"/>

  <!-- Back card (rotated, depth effect) -->
  <g transform="rotate(7 256 256)">
    <rect x="126" y="178" width="280" height="175" rx="18"
          fill="#8b5cf6" fill-opacity="0.18"
          stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>

  <!-- Front card body -->
  <rect x="96" y="158" width="320" height="196" rx="22" fill="url(#cardGrad)"/>

  <!-- Card glass shine -->
  <rect x="96" y="158" width="320" height="98" rx="22" fill="url(#shineGrad)"/>
  <rect x="96" y="234" width="320" height="22" fill="white" fill-opacity="0.02"/>

  <!-- Card border -->
  <rect x="96" y="158" width="320" height="196" rx="22"
        fill="none" stroke="white" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- N letter -->
  <text x="128" y="283"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="96"
        fill="white" opacity="0.95">N</text>

  <!-- Lightning bolt — AI / sync symbol -->
  <path d="M 265 205 L 243 261 L 260 261 L 239 313 L 275 247 L 257 247 Z"
        fill="white" opacity="0.90"/>

  <!-- A letter -->
  <text x="289" y="283"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="96"
        fill="white" opacity="0.95">A</text>

  <!-- Decorative sparkle dots -->
  <circle cx="394" cy="124" r="6"   fill="#c4b5fd" opacity="0.55"/>
  <circle cx="415" cy="146" r="3.5" fill="#93c5fd" opacity="0.45"/>
  <circle cx="107" cy="400" r="5"   fill="#c4b5fd" opacity="0.40"/>
  <circle cx="394" cy="396" r="7"   fill="#6366f1" opacity="0.35"/>
  <circle cx="141" cy="132" r="4"   fill="#93c5fd" opacity="0.35"/>
  <circle cx="128" cy="158" r="2"   fill="white"   opacity="0.20"/>
</svg>
